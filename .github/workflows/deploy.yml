name: Deploy v1 to GitHub Pages

# v1 is retired: cwrumotorsports.com is served by the v2 Worker on Cloudflare
# (see v2/wrangler.jsonc). This no longer runs on push; it is kept as a manual
# run so v1 can be republished to gh-pages if the launch is ever rolled back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: v1

      - name: Build
        run: npm run build
        working-directory: v1

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: v1/dist
          cname: cwrumotorsports.com
